name: Monthly report

# GitHub Actions cron is UTC and has no timezone field. America/Toronto is
# UTC-5 in standard time and UTC-4 in daylight time, so midnight on the 1st
# in Toronto is 05:00 UTC (EST) or 04:00 UTC (EDT). 05:00 UTC on the 1st is
# the earliest clock that is always on the 1st in America/Toronto:
#   EST (UTC-5): 00:00 on the 1st
#   EDT (UTC-4): 01:00 on the 1st
# 00:00 UTC on the 1st is still the previous evening in Toronto, which would
# select the wrong month if the job trusted the cron clock. It does not:
# `clash-reporter run --month previous` resolves the calendar month in
# REPORT_TIMEZONE (America/Toronto).
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Reporting month: YYYY-MM, previous, or current. Default previous."
        required: false
        default: previous
        type: string
  schedule:
    - cron: "0 5 1 * *"

# One report at a time. A dispatch that overlaps the cron waits instead of
# posting concurrently. cancel-in-progress is false so a run already posting
# is not aborted mid-message; the waiter still posts when it starts.
concurrency:
  group: monthly-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  report:
    name: Build and post monthly report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov=clash_reporter

      - name: Build and post the report
        env:
          # Secret. GitHub masks it in logs; the CLI also scrubs it from errors.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # IDs are not credentials. Accept either a repository variable or a secret.
          # Names match the live channels: #members, #wars, #cwl, #capital,
          # #clan-games (required) and #donations (optional).
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
          DISCORD_MEMBERS_CHANNEL_ID: ${{ vars.DISCORD_MEMBERS_CHANNEL_ID || secrets.DISCORD_MEMBERS_CHANNEL_ID }}
          DISCORD_WARS_CHANNEL_ID: ${{ vars.DISCORD_WARS_CHANNEL_ID || secrets.DISCORD_WARS_CHANNEL_ID }}
          DISCORD_CWL_CHANNEL_ID: ${{ vars.DISCORD_CWL_CHANNEL_ID || secrets.DISCORD_CWL_CHANNEL_ID }}
          DISCORD_CAPITAL_CHANNEL_ID: ${{ vars.DISCORD_CAPITAL_CHANNEL_ID || secrets.DISCORD_CAPITAL_CHANNEL_ID }}
          DISCORD_CLAN_GAMES_CHANNEL_ID: ${{ vars.DISCORD_CLAN_GAMES_CHANNEL_ID || secrets.DISCORD_CLAN_GAMES_CHANNEL_ID }}
          DISCORD_DONATIONS_CHANNEL_ID: ${{ vars.DISCORD_DONATIONS_CHANNEL_ID || secrets.DISCORD_DONATIONS_CHANNEL_ID }}
          DISCORD_REPORT_CHANNEL_ID: ${{ vars.DISCORD_REPORT_CHANNEL_ID || secrets.DISCORD_REPORT_CHANNEL_ID }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/Toronto' }}
          REPORT_MONTH: ${{ github.event.inputs.month || 'previous' }}
          # Identity only. Unset values skip the roster; the run still posts.
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          COC_CLAN_TAG: ${{ vars.COC_CLAN_TAG || secrets.COC_CLAN_TAG }}
        run: clash-reporter run --month "$REPORT_MONTH" --post

      - name: Upload raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw
          path: artifacts/raw
          if-no-files-found: warn
          retention-days: 30

      - name: Upload normalized dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized
          path: artifacts/normalized
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: artifacts/normalized/diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 30
